<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Encuesta de Clima Laboral</title>
<!--
  ══════════════════════════════════════════════════════════════
  ClimaIQ — CARGADOR DE ENCUESTAS

  Este archivo ya no contiene ninguna encuesta y no hay que volver
  a tocarlo. La encuesta se arma en el Panel Admin y se publica
  desde ahí al Google Sheets; esta página la pide al abrirse.

  Publicar una encuesta nueva no requiere subir nada al repositorio.

  Cada encuesta responde en su propio link:
      .../climaiq-encuesta/?e=nombre-de-la-empresa
  y el link sin parámetro abre la que esté marcada como activa.
  ══════════════════════════════════════════════════════════════
-->
<style>
:root{--navy:#1c3a5e;--gold:#C09648;--cream:#f7f4ef;--ink:#1A1614;--ink3:#8A837C;--border:#E4DDD4;--red:#8B2A1F;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Jost','Segoe UI',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;
     display:flex;align-items:center;justify-content:center;padding:1.5rem;line-height:1.6;}
.box{max-width:520px;width:100%;text-align:center;}
.ring{width:46px;height:46px;margin:0 auto 1.4rem;border:3px solid var(--border);border-top-color:var(--navy);
      border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem;}
h1{font-size:1.35rem;font-weight:500;color:var(--navy);margin-bottom:.6rem;}
p{color:var(--ink3);font-size:.92rem;}
.card{background:#fff;border:1px solid var(--border);border-top:3px solid var(--red);
      padding:2.2rem 1.8rem;box-shadow:0 4px 20px rgba(11,31,58,.10);text-align:left;}
.card h1{color:var(--red);}
.detail{margin-top:1rem;padding:.8rem 1rem;background:var(--cream);border-left:3px solid var(--border);
        font-size:.85rem;color:var(--ink3);word-break:break-word;}
.btn{display:inline-block;margin-top:1.4rem;padding:.7rem 1.6rem;background:var(--navy);color:#fff;border:none;
     font-family:inherit;font-size:.9rem;cursor:pointer;letter-spacing:.02em;}
.btn:hover{background:#16304e;}
.hint{margin-top:1.2rem;font-size:.8rem;color:var(--ink3);}
</style>
</head>
<body>
<div class="box" id="pantalla">
  <div class="ring"></div>
  <div class="eyebrow">Evaluación interna · Confidencial</div>
  <h1>Abriendo la encuesta…</h1>
  <p>Un momento, por favor.</p>
</div>

<script>
// TODO el cargador vive dentro de esta función, y no es un adorno.
//
// document.open() borra la página pero NO borra las variables de JavaScript.
// La encuesta que se escribe después declara sus propias APPS_SCRIPT_URL y
// escHtml; si el cargador las hubiera dejado sueltas en el ámbito global, la
// segunda declaración revienta con "Identifier has already been declared" y
// se cae el script COMPLETO de la encuesta. El formulario se sigue viendo,
// porque es HTML estático, pero el botón Enviar se queda sin nada enganchado:
// la persona contesta, presiona, y su respuesta no se guarda ni avisa.
// Así se perdieron respuestas de Arrendadora.
(function () {
// Mismo despliegue que usan la encuesta y el dashboard.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxNnPykTYJc2v3UlGyBkecxgC5geHaQYwE5KfMfQxA7L1gNFihDjM2_D9NNpKuWwiIJ/exec';

// ?e=empresa (también se acepta ?encuesta= por si el link viene escrito así)
const params = new URLSearchParams(location.search);
const ID = (params.get('e') || params.get('encuesta') || '').trim();

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function mostrarError(titulo, detalle) {
  document.getElementById('pantalla').innerHTML =
    '<div class="card">' +
      '<div class="eyebrow">Encuesta de Clima Laboral</div>' +
      '<h1>' + escHtml(titulo) + '</h1>' +
      '<p>Vuelve a intentarlo. Si el problema sigue, avisa a Recursos Humanos ' +
      'antes de responder, para que no se pierdan tus respuestas.</p>' +
      (detalle ? '<div class="detail">' + escHtml(detalle) + '</div>' : '') +
      '<button class="btn" onclick="location.reload()">Reintentar</button>' +
      (ID ? '<div class="hint">Encuesta solicitada: <strong>' + escHtml(ID) + '</strong></div>' : '') +
    '</div>';
}

async function abrirEncuesta() {
  try {
    const url = APPS_SCRIPT_URL + '?action=getSurvey' + (ID ? '&id=' + encodeURIComponent(ID) : '');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('El servidor respondió ' + res.status + '.');

    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'No se pudo leer la encuesta.');
    if (!json.html)    throw new Error('La encuesta llegó vacía.');

    // La encuesta viene armada tal cual se aprobó en el panel: se escribe
    // completa, con su propio título, estilos y comportamiento.
    document.open();
    document.write(json.html);
    document.close();
  } catch (err) {
    mostrarError('No se pudo abrir la encuesta', err.message);
  }
}

abrirEncuesta();
})();
</script>
</body>
</html>
